spring.application.name=backend
server.port=8080

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# JWT Configuration
jwt.secret=messagerie-secure-chat-jwt-secret-key-2024-minimum-32-characters-required
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/messagerie_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
